services:
  db:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    profiles: [core, ai, import, full]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-django_rag}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-django_rag}"]
      interval: 5s
      timeout: 5s
      retries: 12

  valkey:
    image: valkey/valkey:8-alpine
    profiles: [core, ai, import, full]
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkeydata:/data
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build: .
    profiles: [core, ai, import, full]
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload
    working_dir: /app/backend
    volumes:
      - ./backend:/app/backend
      - modelcache:/root/.cache/huggingface
      - ./data:/app/data
    ports:
      - "8000:8000"
    env_file: [.env]
    environment:
      POSTGRES_HOST: db
      ALLOWED_HOSTS: localhost,127.0.0.1,web,nginx
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8080
      VALKEY_URL: redis://valkey:6379/1
      CELERY_BROKER_URL: redis://valkey:6379/2
      CELERY_RESULT_BACKEND: redis://valkey:6379/3
      OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      db: { condition: service_healthy }
      valkey: { condition: service_healthy }

  frontend:
    build: ./frontend
    profiles: [core, ai, import, full]
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on: [web]

  ollama:
    image: ollama/ollama:0.11.4
    profiles: [ai, full]
    volumes:
      - ollamadata:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        limits:
          memory: 6G

  worker:
    build: .
    profiles: [ai, full]
    command: celery -A config worker --loglevel=info --concurrency=1
    working_dir: /app/backend
    volumes:
      - ./backend:/app/backend
      - modelcache:/root/.cache/huggingface
      - ./data:/app/data
    env_file: [.env]
    environment:
      POSTGRES_HOST: db
      ALLOWED_HOSTS: localhost,127.0.0.1,web,nginx
      VALKEY_URL: redis://valkey:6379/1
      CELERY_BROKER_URL: redis://valkey:6379/2
      CELERY_RESULT_BACKEND: redis://valkey:6379/3
      OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      db: { condition: service_healthy }
      valkey: { condition: service_healthy }

  osm-import:
    build: .
    profiles: [import]
    command: python manage.py import_osm_pois /app/data/greece-latest.osm.pbf
    working_dir: /app/backend
    volumes:
      - ./data:/app/data
    env_file: [.env]
    environment:
      POSTGRES_HOST: db
      ALLOWED_HOSTS: localhost,127.0.0.1,web,nginx
      VALKEY_URL: redis://valkey:6379/1
      EMBEDDINGS_ENABLED: "False"
    depends_on:
      db: { condition: service_healthy }

  nginx:
    image: nginx:1.27-alpine
    profiles: [full]
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [web, frontend]

volumes:
  pgdata:
  valkeydata:
  ollamadata:
  modelcache:
  frontend_modules:
