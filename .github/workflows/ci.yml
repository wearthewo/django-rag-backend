name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev
      - name: Start PostGIS and pgvector
        run: |
          cp .env.example .env
          docker compose --profile core up -d --build --wait db
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python dependencies
        run: pip install -r requirements.txt ruff==0.12.8
      - name: Backend checks and tests
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-only
          POSTGRES_PASSWORD: postgres
          EMBEDDINGS_ENABLED: "False"
        run: |
          python manage.py migrate
          python manage.py makemigrations --check --dry-run
          python manage.py check
          python manage.py test
      - name: Backend lint
        run: ruff check backend
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Validate and build Docker services
        run: |
          docker compose --profile full --profile import config --quiet
          docker compose --profile core build db web frontend
      - name: Stop test services
        if: always()
        run: docker compose --profile core down --volumes
