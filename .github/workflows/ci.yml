name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: django_rag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d django_rag"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Install pgvector
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev
          docker exec ${{ job.services.postgres.id }} apt-get update
          docker exec ${{ job.services.postgres.id }} apt-get install -y postgresql-16-pgvector
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python dependencies
        run: pip install -r requirements.txt ruff==0.12.8
      - name: Backend checks and tests
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-only
          POSTGRES_PASSWORD: postgres
          EMBEDDINGS_ENABLED: "False"
        run: |
          python manage.py migrate
          python manage.py makemigrations --check --dry-run
          python manage.py check
          python manage.py test
      - name: Backend lint
        run: ruff check backend
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Validate and build Docker services
        run: |
          cp .env.example .env
          docker compose --profile full --profile import config --quiet
          docker compose --profile core build db web frontend
